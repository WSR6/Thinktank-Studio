name: Bug report
description: Something in the app doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Create a project…
        2. Click Build…
  - type: input
    id: agents
    attributes:
      label: Which agents were in the team?
      placeholder: e.g. Claude Code, Codex (gpt-6.1), Grok
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error messages
      description: Paste any error text or drag in a screenshot. Remove anything private first.
